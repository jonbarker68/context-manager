# yaml-language-server: $schema=https://carapace.sh/schemas/command.json

name: ctx
description: Context manager

commands:
  - name: list
    description: List available contexts

  - name: now
    description: Open the context for the current calendar event

  - name: here
    description: Open the context associated with the current directory

  - name: open
    description: Open a context
    completion:
      positional:
        - ["$(ctx _complete contexts)"]

  - name: close
    description: Close a context
    completion:
      positional:
        - ["$(ctx _complete contexts)"]

  - name: edit
    description: Edit a context descriptor
    completion:
      positional:
        - ["$(ctx _complete contexts)"]

  - name: note
    description: Open notes for a context
    flags:
      --print: Print resolved note paths without opening them
      --root: Open the configured root note
      --open=: Open a note directly
    completion:
      positional:
        - ["$(ctx _complete notes)"]

  - name: mark
    description: Associate the current directory with a context
    completion:
      positional:
        - ["$(ctx _complete contexts)"]

  - name: unmark
    description: Remove the context marker from the current directory

  - name: new
    description: Create a context for the current code directory
    flags:
      --description=: Set the context description

  - name: calendar
    description: Manage calendar integration
    commands:
      - name: status
        description: Show calendar integration status
      - name: auth
        description: Authorise calendar access

  - name: todo
    description: Capture and synchronise TODO items
    flags:
      --url=: Attach a URL (legacy direct capture form)
      --date=: Set the item date (YYYY-MM-DD HH:MM; legacy direct capture form)
    commands:
      - name: add
        description: Add an item to the configured TODO inbox
        flags:
          --url=: Attach a URL
          --date=: Set the item date (YYYY-MM-DD HH:MM)
      - name: scan
        description: Report unchecked project TODOs under ## TODO headings
      - name: sync
        description: Assign TODO IDs and synchronise project ghosts
      - name: file
        description: File a TODO into a project note and leave a ghost in place
        flags:
          --source=: Source Markdown note
          --line=: One-based source line number
          --destination=: Destination project note

  - name: ensure-ids
    description: Add immutable IDs to context descriptors

  - name: spaces
    description: Show managed context Spaces and their occupancy

  - name: repair
    description: Repair missing managed Spaces and reconcile labels/state

  - name: clean
    description: Review and clean orphan windows on unassigned context Spaces

  - name: switch
    description: Switch to an already-open context
    completion:
      positional:
        - ["$(ctx _complete contexts)"]
